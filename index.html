async function getListings(f={}){
  if(sb){
    let q=sb.from('listings').select('*, seller:profiles(full_name,is_verified,phone)').eq('status','active');
    if(f.q)q=q.textSearch('search',f.q.split(/\s+/).join(' & '));
    if(f.cat){const c=CATS.find(x=>x.slug===f.cat);if(c)q=q.eq('category_id',c.id)}
    if(f.uni)q=q.eq('university_id',+f.uni);if(f.cond)q=q.eq('condition',f.cond);
    if(f.max)q=q.lte('price',+f.max);if(f.feat)q=q.eq('featured',true);
    q=f.sort==='price'?q.order('price'):q.order('created_at',{ascending:false});
    const {data,error}=await q.limit(48);if(error)throw error;return data;
  }
  let r=DEMO.filter(l=>(!f.q||(l.title+l.description).toLowerCase().includes(f.q.toLowerCase()))&&
    (!f.cat||CATS.find(c=>c.slug===f.cat)?.id===l.category_id)&&(!f.uni||l.university_id==f.uni)&&
    (!f.cond||l.condition===f.cond)&&(!f.max||l.price<=+f.max)&&(!f.feat||l.featured));
  return f.sort==='price'?r.sort((a,b)=>a.price-b.price):r;
}
async function getListing(id){
  if(sb){const {data}=await sb.from('listings').select('*, seller:profiles(full_name,is_verified,phone)').eq('id',id).single();return data}
  return DEMO.find(l=>l.id===id);
}

  if(page){$('#app').innerHTML=html.replace('class="modal" onclick="if(event.target===this)this.remove()"','class="authpg"')}else $('#modal').innerHTML=html;
  $('#sw').onclick=e=>{e.preventDefault();authModal(mode==='in'?'up':'in',page,next)};
  if($('#fp'))$('#fp').onclick=async e=>{e.preventDefault();const em=$('#af').email.value;if(!em)return $('#ae').textContent='Enter your email first.';

const MAXPH=8;
async function shrink(file){
  const b=await createImageBitmap(file),k=Math.min(1,1280/Math.max(b.width,b.height)),c=document.createElement('canvas');
  c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext('2d').drawImage(b,0,0,c.width,c.height);b.close?.();
  return new Promise((ok,no)=>c.toBlob(x=>x?ok(x):no(new Error('encode')),'image/jpeg',.82));
}

function initSell(){
  const f=$('#sf');if(!f)return;const E=f.elements,pv=$('#pv'),dz=$('#dz');let files=[],drag=-1,busy=false;
  const setErr=(k,m)=>{const el=f.querySelector(`[data-e="${k}"]`);if(el)el.textContent=m||'';const i=E[k];if(i&&i.setAttribute)m?i.setAttribute('aria-invalid','true'):i.removeAttribute('aria-invalid')};
  const draw=()=>{pv.innerHTML=files.map((x,i)=>`<div class="pi" draggable="true" data-i="${i}"><img src="${x.url}" alt="Photo ${i+1}" draggable="false">${i?'':'<span class="cover">Cover</span>'}<div class="pa"><button type="button" data-a="l" data-i="${i}" aria-label="Move photo ${i+1} earlier" ${i?'':'disabled'}>‹</button><button type="button" data-a="x" data-i="${i}" aria-label="Remove photo ${i+1}">×</button><button type="button" data-a="r" data-i="${i}" aria-label="Move photo ${i+1} later" ${i<files.length-1?'':'disabled'}>›</button></div></div>`).join('');$('#pc').textContent=files.length+'/'+MAXPH};
  const add=async list=>{setErr('ph');
    for(const file of list){
      if(files.length>=MAXPH){setErr('ph',`You can add up to ${MAXPH} photos.`);break}
      if(!/^image\/(jpeg|png|webp)$/.test(file.type)){setErr('ph','Use JPG, PNG or WebP photos.');continue}
      if(file.size>15e6){setErr('ph','Each photo must be under 15 MB.');continue}
      try{const blob=await shrink(file);files.push({blob,url:URL.createObjectURL(blob)})}catch{setErr('ph','One photo could not be read. Try a different file.')}}
    draw()};
  E.ph.onchange=async()=>{await add([...E.ph.files]);E.ph.value=''};
  ['dragenter','dragover'].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.add('on')}));
  ['dragleave','drop'].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.remove('on')}));
  dz.addEventListener('drop',e=>add([...e.dataTransfer.files]));
  pv.onclick=e=>{const b=e.target.closest('button');if(!b)return;const i=+b.dataset.i,a=b.dataset.a;
    if(a==='x'){URL.revokeObjectURL(files[i].url);files.splice(i,1)}
    else{const j=a==='l'?i-1:i+1;if(j<0||j>=files.length)return;[files[i],files[j]]=[files[j],files[i]]}draw()};
  pv.ondragstart=e=>{const p=e.target.closest('.pi');if(p){drag=+p.dataset.i;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','')}};
  pv.ondragover=e=>{if(drag>-1)e.preventDefault()};
  pv.ondrop=e=>{const p=e.target.closest('.pi');if(drag>-1&&p){e.preventDefault();const [m]=files.splice(drag,1);files.splice(+p.dataset.i,0,m);draw()}drag=-1};
  pv.ondragend=()=>{drag=-1};
  const validate=()=>{let ok=true;const bad=(k,m)=>{setErr(k,m);ok=false};
    ['ph','ttl','desc','cat','price','uni','loc','form'].forEach(k=>setErr(k));
    if(!files.length)bad('ph','Add at least one photo.');
    if(E.ttl.value.trim().length<3)bad('ttl','Enter a title of at least 3 characters.');
    if(E.desc.value.trim().length<10)bad('desc','Describe the item in at least 10 characters.');
    if(!E.cat.value)bad('cat','Choose a category.');
    if(E.price.value===''||!(+E.price.value>=0))bad('price','Enter a price in KES.');
    if(!E.uni.value)bad('uni','Choose your university.');
    if(!E.loc.value.trim())bad('loc','Enter a pick-up location.');
    return ok};
  f.onsubmit=async e=>{e.preventDefault();if(busy)return;
    if(!validate()){f.querySelector('.err:not(:empty)')?.scrollIntoView({behavior:'smooth',block:'center'});return}
    busy=true;const b=f.querySelector('.sub');b.disabled=true;b.textContent='Publishing…';
    const row={title:E.ttl.value.trim(),description:E.desc.value.trim(),price:+E.price.value,negotiable:E.neg.checked,condition:E.cond.value,
      category_id:+E.cat.value,university_id:+E.uni.value,location:E.loc.value.trim(),hostel:E.hostel.value.trim()||null,county:E.county.value.trim()||null,
      delivery:E.del.checked,meetup:E.meet.checked};
    const phone=E.phone.value.replace(/\D/g,''),paths=[];let id,pend=false;
    try{
      if(sb){
        const urls=await Promise.all(files.map(async x=>{const path=`${user.id}/${crypto.randomUUID()}.jpg`;
          const {error}=await sb.storage.from('listing-images').upload(path,x.blob,{contentType:'image/jpeg',cacheControl:'31536000'});
          if(error)throw error;paths.push(path);return sb.storage.from('listing-images').getPublicUrl(path).data.publicUrl}));
        if(phone)await sb.from('profiles').update({phone}).eq('id',user.id);
        const {data,error}=await sb.from('listings').insert({...row,images:urls,seller_id:user.id}).select('id,status').single();
        if(error)throw error;id=data.id;pend=data.status==='pending';
      }else{
        id='d'+Date.now();
        DEMO.unshift({...row,id,images:files.map(x=>x.url),featured:false,created_at:new Date().toISOString(),seller:{full_name:'You',is_verified:false,phone}});
      }
      toast(pend?'Submitted. A moderator will review it shortly.':'Listing published');location.hash='#/listing/'+id;
    }catch(ex){
      if(paths.length)sb.storage.from('listing-images').remove(paths);
      setErr('form',/row-level security/i.test(ex.message||'')?'Permission denied. Your account may be suspended, or the latest SQL migrations have not been run.':(ex.message||'Could not publish. Check your connection and try again.'));
      busy=false;b.disabled=false;b.textContent='Publish listing';
    }};
}

function dlg(title,body,{ok='Confirm',danger=false}={}){return new Promise(res=>{
  const m=document.createElement('div'),prev=document.activeElement;m.className='modal';
  m.innerHTML=`<form class="mb" role="dialog" aria-modal="true" aria-labelledby="dt"><h2 id="dt" style="margin:0;font-size:1.3rem">${esc(title)}</h2>${body}<div class="acts" style="margin:0">${ok?`<button class="btn ${danger?'d':''}">${esc(ok)}</button>`:''}<button type="button" class="btn g" data-x>${ok?'Cancel':'Close'}</button></div></form>`;
  const close=v=>{m.remove();removeEventListener('keydown',kd);prev?.focus?.();res(v)},kd=e=>{if(e.key==='Escape')close(null)};
  addEventListener('keydown',kd);
  m.onclick=e=>{if(e.target===m||e.target.hasAttribute('data-x'))close(null)};
  m.firstChild.onsubmit=e=>{e.preventDefault();close(Object.fromEntries(new FormData(e.target)))};
  document.body.append(m);(m.querySelector('textarea,select,input')||m.querySelector('button'))?.focus()})}

function bars(days,rows,label){
  const m={};rows.forEach(r=>{const d=r.created_at.slice(0,10);m[d]=(m[d]||0)+1});
  const v=days.map(d=>m[d]||0),W=600,H=150,mx=Math.max(1,...v),bw=W/v.length,tot=v.reduce((a,b)=>a+b,0);
  return `<div class="box"><b>${label}</b> <span class="meta">last 30 days, ${tot} total</span>
  <svg viewBox="0 0 ${W} ${H+24}" role="img" aria-label="${label}: ${tot} in the last 30 days" style="width:100%;height:auto;margin-top:8px">
  ${v.map((n,i)=>`<rect x="${i*bw+2}" y="${H-n/mx*H}" width="${bw-4}" height="${Math.max(n/mx*H,n?3:1)}" rx="3" style="fill:${n?'var(--blue)':'var(--line)'}"><title>${days[i]}: ${n}</title></rect>`).join('')}
  <text x="0" y="${H+16}" font-size="11" style="fill:var(--mute)">${days[0].slice(5)}</text><text x="${W}" y="${H+16}" font-size="11" text-anchor="end" style="fill:var(--mute)">${days[days.length-1].slice(5)}</text>
  <text x="${W}" y="10" font-size="11" text-anchor="end" style="fill:var(--mute)">peak ${mx}</text></svg></div>`}

   <td>${esc(UNIS.find(x=>x.id===u.university_id)?.name||'—')}</td><td>${esc(u.phone||'—')}</td><td>${ago(u.created_at)}</td>
   <td><div class="acts2"><button class="btn sm g" data-act="view" data-id="${esc(u.id)}">View</button><button class="btn sm g" data-act="verify" data-id="${esc(u.id)}" data-v="${u.is_verified?0:1}">${u.is_verified?'Unverify':'Verify'}</button>${u.id===user.id?'':`<button class="btn sm ${u.is_suspended?'':'d'}" data-act="suspend" data-id="${esc(u.id)}" data-v="${u.is_suspended?0:1}">${u.is_suspended?'Unsuspend':'Suspend'}</button>`}</div></td></tr>`).join('');
  c.innerHTML=`<div class="row" style="margin-bottom:14px"><h1 class="ah" style="margin:0">Users</h1><form id="us" role="search" style="display:flex;gap:8px"><input class="f" name="q" value="${esc(q)}" placeholder="Search by name" aria-label="Search users" style="width:220px"><button class="btn">Search</button></form></div>${tbl(['User','University','Phone','Joined','Actions'],rows)}`;
  $('#us').onsubmit=e=>{e.preventDefault();location.hash='#/admin/users'+(e.target.q.value.trim()?'?q='+encodeURIComponent(e.target.q.value.trim()):'')};
  c.onclick=async e=>{const b=e.target.closest('button[data-act]');if(!b)return;const id=b.dataset.id,a=b.dataset.act,u=data.find(x=>x.id===id);b.disabled=true;
    try{
      if(a==='view'){const {count}=await sb.from('listings').select('*',{count:'exact',head:true}).eq('seller_id',id);b.disabled=false;
        await dlg(u.full_name||'Unnamed',`<p class="meta" style="margin:0">Joined ${ago(u.created_at)} · ${count??0} listing${count===1?'':'s'}</p><p style="margin:0">${esc(UNIS.find(x=>x.id===u.university_id)?.name||'No university')}${u.course?' · '+esc(u.course):''}${u.year_of_study?', year '+esc(u.year_of_study):''}</p><p style="margin:0">Phone: ${esc(u.phone||'—')}</p><p style="margin:0">${esc(u.bio||'No bio yet.')}</p>`,{ok:null});return}
      if(a==='verify')await upd('profiles',id,{is_verified:b.dataset.v==='1'});
      if(a==='suspend'){const on=b.dataset.v==='1';
        if(on&&!await dlg('Suspend user','<p style="margin:0">They will no longer be able to post listings or send messages.</p>',{ok:'Suspend',danger:true})){b.disabled=false;return}
        await upd('profiles',id,{is_suspended:on})}
      toast('Done');admUsers(c,p)}catch(ex){toast(ex.message);b.disabled=false}};
}
async function admReports(c,p){
  const st=p.get('s')||'open';
  let q=sb.from('reports').select('id,reason,details,status,created_at,listing:listings(id,title,status),reporter:profiles(full_name)').order('created_at',{ascending:false}).limit(100);
  if(st!=='all')q=q.eq('status',st);const {data,error}=await q;if(error)throw error;
  const rows=(data||[]).map(r=>`<tr><td>${r.listing?`<a href="#/listing/${esc(r.listing.id)}"><b>${esc(r.listing.title)}</b></a> ${chip(r.listing.status)}`:'<span class="meta">Listing deleted</span>'}</td>
   <td><b>${esc(r.reason)}</b>${r.details?`<div class="meta">${esc(r.details)}</div>`:''}</td><td>${esc(r.reporter?.full_name||'Unknown')}</td><td>${ago(r.created_at)}</td>
   <td>${r.status==='open'?`<div class="acts2"><button class="btn sm" data-act="resolved" data-id="${esc(r.id)}">Resolve</button><button class="btn sm g" data-act="dismissed" data-id="${esc(r.id)}">Dismiss</button></div>`:chip(r.status)}</td></tr>`).join('');
  c.innerHTML=`<div class="row" style="margin-bottom:14px"><h1 class="ah" style="margin:0">Reports</h1><label class="meta">Status <select class="f" id="fs" style="width:auto">${['open','resolved','dismissed','all'].map(s=>`<option ${s===st?'selected':''}>${s}</option>`).join('')}</select></label></div>${tbl(['Listing','Reason','Reported by','Date','Action'],rows)}`;
  $('#fs').onchange=e=>{location.hash='#/admin/reports?s='+e.target.value};
  c.onclick=async e=>{const b=e.target.closest('button[data-act]');if(!b)return;b.disabled=true;
    try{await upd('reports',b.dataset.id,{status:b.dataset.act,resolved_by:user.id,resolved_at:new Date().toISOString()});toast('Report '+b.dataset.act);admReports(c,p)}catch(ex){toast(ex.message);b.disabled=false}};
}
async function admContent(c){
  const {data,error}=await sb.from('banners').select('*').order('sort_order');if(error)throw error;
  const rows=(data||[]).map(b=>`<tr><td><div class="who"><span class="th">${/^https?:/.test(b.image_url)?`<img src="${esc(b.image_url)}" alt="">`:''}</span><b>${esc(b.title)}</b></div></td><td>${b.sort_order}</td><td>${chip(b.is_active?'active':'removed').replace('removed','hidden')}</td>
   <td><div class="acts2"><button class="btn sm g" data-act="edit" data-id="${esc(b.id)}">Edit</button><button class="btn sm g" data-act="toggle" data-id="${esc(b.id)}">${b.is_active?'Hide':'Show'}</button><button class="btn sm d" data-act="delete" data-id="${esc(b.id)}">Delete</button></div></td></tr>`).join('');
  c.innerHTML=`<h1 class="ah">Banners</h1><form class="box fs" id="bf" style="margin-bottom:16px"><h3 id="bh">New banner</h3><input type="hidden" name="id">
   <div class="two"><label>Title<input class="f" name="title" required maxlength="80"></label><label>Link (optional)<input class="f" name="link" placeholder="https://… or #/browse?cat=books"></label></div>
   <div class="two"><label>Image file<input class="f" type="file" name="file" accept="image/jpeg,image/png,image/webp"></label><label>…or image URL<input class="f" name="img" placeholder="https://…"></label></div>
   <div class="two"><label>Sort order<input class="f" type="number" name="sort" value="0"></label><label class="ck tg">Active<input type="checkbox" name="act" checked></label></div>
   <div class="err" data-e role="alert"></div><div class="acts" style="margin:0"><button class="btn o">Save banner</button><button type="button" class="btn g" id="bc" hidden>Cancel edit</button></div></form>
   ${tbl(['Banner','Order','Status','Actions'],rows)}`;
  const f=$('#bf'),E=f.elements,err=f.querySelector('[data-e]'),fresh=()=>admContent(c);
  f.onsubmit=async e=>{e.preventDefault();err.textContent='';const id=E.id.value,ex=(data||[]).find(b=>b.id===id),link=E.link.value.trim();
    if(link&&!safeLink(link))return err.textContent='Link must start with https://, / or #/';
    let url=E.img.value.trim();const file=E.file.files[0];
    try{
      if(file){if(!/^image\/(jpeg|png|webp)$/.test(file.type))return err.textContent='Use a JPG, PNG or WebP image.';
        const path=crypto.randomUUID()+'.jpg',{error:ue}=await sb.storage.from('banners').upload(path,await shrink(file),{contentType:'image/jpeg'});if(ue)throw ue;url=sb.storage.from('banners').getPublicUrl(path).data.publicUrl}
      else if(url){if(!/^https?:\/\//.test(url))return err.textContent='Image URL must start with https://'}
      else if(ex)url=ex.image_url;else return err.textContent='Add an image file or URL.';
      const row={title:E.title.value.trim(),link:link||null,image_url:url,sort_order:+E.sort.value||0,is_active:E.act.checked};
      if(id)await upd('banners',id,row);else{const {error:ie}=await sb.from('banners').insert(row);if(ie)throw ie}
      toast('Banner saved');fresh()}catch(x){err.textContent=x.message}};
  c.onclick=async e=>{const b=e.target.closest('button[data-act],#bc');if(!b)return;if(b.id==='bc')return fresh();
    const id=b.dataset.id,x=data.find(y=>y.id===id);
    try{
      if(b.dataset.act==='edit'){E.id.value=id;E.title.value=x.title;E.link.value=x.link||'';E.img.value=x.image_url;E.sort.value=x.sort_order;E.act.checked=x.is_active;$('#bh').textContent='Edit banner';$('#bc').hidden=false;E.title.focus();return}
      if(b.dataset.act==='toggle')await upd('banners',id,{is_active:!x.is_active});
      if(b.dataset.act==='delete'){if(!await dlg('Delete banner','<p style="margin:0">Remove this banner from the homepage?</p>',{ok:'Delete',danger:true}))return;await del('banners',id)}
      toast('Done');fresh()}catch(ex){toast(ex.message)}};
}
async function admRevenue(c){
  const {data,error}=await sb.from('transactions').select('*').order('created_at',{ascending:false}).limit(10);
  if(error||!data)return c.innerHTML=`<h1 class="ah">Revenue</h1><div class="empty box"><h2>Payments aren't enabled yet</h2><p>Commission, featured-listing and subscription revenue will appear here once a <code>transactions</code> table exists.</p></div>`;
  const total=data.reduce((a,t)=>a+(+t.amount||0),0);
  c.innerHTML=`<h1 class="ah">Revenue</h1><div class="cards"><div class="st"><b>${KES(total)}</b><span>Latest ${data.length} transactions</span></div></div><div style="margin-top:14px">${tbl(['Date','Amount','Status','Reference'],data.map(t=>`<tr><td>${ago(t.created_at)}</td><td>${t.amount!=null?KES(t.amount):'—'}</td><td>${esc(t.status||'—')}</td><td class="meta">${esc(String(t.id).slice(0,8))}</td></tr>`).join(''))}</div>`;
}

/* ---- Router ---- */
async function route(){
  const [path,qs]=(location.hash.slice(1)||'/').split('?'),p=new URLSearchParams(qs||''),app=$('#app');
  $('#fab').style.visibility=path==='/sell'||path.startsWith('/admin')?'hidden':'';
  if(path.startsWith('/admin')){if(!isStaff()){location.replace('#/');return}app.innerHTML='<div class="empty">Loading…</div>';await adminView(path.split('/')[2]||'overview',p);scrollTo(0,0);return}
  if(path==='/sell'&&sb&&!user){location.replace('#/auth?next=%2Fsell');return}
  if(path==='/auth'){if(user||!sb){location.replace('#'+(p.get('next')||'/'));return}authModal('in',true,p.get('next')||'/');return}
  app.innerHTML='<div class="empty">Loading…</div>';
  try{
    app.innerHTML=path.startsWith('/listing/')?await detail(path.split('/')[2]):path==='/browse'?await browse(p):path==='/sell'?sellView():path==='/photos'?photosView():await home();
  }catch(e){app.innerHTML=`<div class="empty"><h2>Something went wrong</h2><p>${esc(e.message)}</p></div>`}
  document.title=path==='/'?'Campus Marketplace — Buy and sell on campus in Kenya':'Campus Marketplace';scrollTo(0,0);
  if(path==='/sell')initSell();
  $('#hs')?.addEventListener('submit',e=>{e.preventDefault();location.hash='#/browse?q='+encodeURIComponent(e.target.q.value)});
  $('#ff')?.addEventListener('submit',e=>{e.preventDefault();const q=new URLSearchParams([...new FormData(e.target)].filter(x=>x[1]));location.hash='#/browse?'+q});
  document.querySelectorAll('.thumbs .ph').forEach(t=>t.onclick=()=>$('#mp').innerHTML=photo(window.__l||{images:[]},t.dataset.i)||t.innerHTML);
}
addEventListener('hashchange',route);
$('#theme').onclick=()=>{const d=document.documentElement,n=d.dataset.theme==='dark'?'light':'dark';d.dataset.theme=n;try{localStorage.setItem('theme',n)}catch{}};
try{const t=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.theme=t}catch{}
(async()=>{if(sb){user=(await sb.auth.getUser()).data.user;await loadRefs();await loadMe();if(location.search.includes('code='))history.replaceState(null,'',location.pathname+location.hash)}renderAuth();route()})();
</script>
